# Wildcard: redireciona qualquer /medicamentos/* restante para /medicamento/:splat
[[redirects]]
  from = "/medicamentos/*"
  to = "/medicamento/:splat"
  status = 301
  force = true

[build]
  publish = "dist"
  command = ""

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/*.cjs"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/lote*.json"
  [headers.values]
    X-Robots-Tag = "noindex"
